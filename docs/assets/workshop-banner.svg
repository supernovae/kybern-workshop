<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Kybern Workshop</title>
  <desc id="desc">Shareable recipes and reproducible small-model experiments built with Tiny Sparse Lab.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#0d1726"/>
      <stop offset="1" stop-color="#17243a"/>
    </linearGradient>
