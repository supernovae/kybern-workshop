# SpamLang (P5): the arm's model on documents that each repeat one symbol, a
# whole-word token of the run's tokenizer, 511 times then <eos>, so every
# 512-token row is one document. 40.9M tokens, the paper's budget. One seed,
# as in the paper's learning-rate x vocabulary grid.
schema_version: 2
name: tinystories-spamlang
seed: 1
model:
  # Shaped like llama2.c's 42M TinyStories model: width 512, 8 layers, 8 heads,
  # SwiGLU width 1376 (2/3 of 4 x 512, rounded up to a multiple of 32).
  vocab_size: 32768
  hidden_dim: 512
  num_layers: 8
  num_heads: 8
  ffn_dim: 1376
  max_seq_len: 512
  # Untied, so the base model is the control arm of the LM-head experiment,
  # whose rank-limited heads need untied embeddings.
  tie_embeddings: false
attention:
  kind: dense
  implementation: sdpa
tokenizer:
  path: ../tokenizer-32k/tokenizer.json
  # The tokenizer was fitted on the TinyStories snapshot, not on this synthetic
  # data, so the run names where it came from. The digests are what
  # `klab tokenizer train ../tokenizer.yaml` produces from the pinned snapshot
  # with tokenizers 0.22 (refitting reproduced them byte for byte).
  origin:
    sha256: 2bd4d6d8a7039aa94ba8ef1508d8816beef0a121d902f8fd5e15cd9029b27de4
    manifest_sha256: 9936c81483e203dc6e25448c09cf97b7391e61fc910f471ed8687d9c22d5a2b7
    dataset:
      source: snapshot
      revision: f54c09fd23315a6f9c86f9dc80f725de7d8f9c64
      cache_dir: ../data
      train_path: ../snapshot/train.jsonl
      validation_path: ../snapshot/validation.jsonl
      source_manifest_path: ../snapshot/manifest.json
      license: CDLA-Sharing-1.0
      train_max_documents: 1792647
      validation_max_documents: 21990
      train_max_tokens: 1000000000
      validation_max_tokens: 10000000
dataset:
  source: synthetic
  synthetic_task: repeat_token
  synthetic_repeat_length: 511
  synthetic_seed: 7
  cache_dir: ../data
  train_max_documents: 80000
  validation_max_documents: 1000
  train_max_tokens: 40960000
  validation_max_tokens: 512000
training:
  # 512-token rows, 32 per microbatch, 8 microbatches per update: 131,072
  # tokens per update, 4 microbatches on each card.
  seq_len: 512
  micro_batch_size: 32
  gradient_accumulation: 8
  # 312 updates of 131,072 tokens: under one pass over the 80,000 documents.
  max_steps: 312
  max_tokens: 40894464
  grad_clip_norm: 1.0
  deterministic: false
optimizer:
  name: adamw
  peak: 0.0005
  floor: 0.00005
  warmup_steps: 30
  weight_decay: 0.1
  betas: [0.9, 0.95]
evaluation:
  every_steps: 100
  max_batches: 16
  # Arms with different tokenizers compare on bits per byte.
  text_documents: 200
  gradient_bottleneck: true
logging:
  root_dir: ../runs
  every_steps: 10
runtime:
  engine: pytorch
  backend: xpu
  device_index: 0
  precision: bf16
  compile_transformer_blocks: true
  compile_output_head_loss: true
  memory:
    # The planner estimates 15.2 GiB for one 32-row microbatch; 4.6 GiB was
    # measured. Observe the estimate; the spill guard still stops a run that
    # really fills the card.
    estimate_policy: observe
checkpoint:
  every_steps: 312
  # Each arm keeps only its latest and previous checkpoints; the sweeps train
  # 49 runs.
  keep_periodic: false
  save_on_new_best: false
staging:
  smoke_steps: 2
  warmup_steps: 5
