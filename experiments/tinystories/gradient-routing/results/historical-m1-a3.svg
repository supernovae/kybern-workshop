<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">A3 mature-checkpoint M1 comparison</title><desc id="desc">Actual capture is above all shuffled draws, but the paired actual-minus-uniform bootstrap interval overlaps zero.</desc><rect width="960" height="440" fill="white"/><g font-family="system-ui,sans-serif" fill="#20334A"><text x="25" y="38" font-size="23" font-weight="600">A3: Mature pairing signal, but the joint rule fails</text><text x="25" y="68" font-size="14">One 4k-vocabulary run, centered capture from step 243968 to step 244141.</text><path d="M335.0 82v164" stroke="#D3DFE8"/><text x="335.0" y="263" text-anchor="middle" font-size="12">0.043%</text><path d="M452.8 82v164" stroke="#D3DFE8"/><text x="452.8" y="263" text-anchor="middle" font-size="12">0.044%</text><path d="M570.6 82v164" stroke="#D3DFE8"/><text x="570.6" y="263" text-anchor="middle" font-size="12">0.045%</text><path d="M688.3 82v164" stroke="#D3DFE8"/><text x="688.3" y="263" text-anchor="middle" font-size="12">0.046%</text><path d="M806.1 82v164" stroke="#D3DFE8"/><text x="806.1" y="263" text-anchor="middle" font-size="12">0.047%</text><text x="25" y="97" font-size="14">Actual probabilities and targets</text><circle cx="790.88" cy="93" r="5.5" fill="#217D77"/><text x="25" y="129" font-size="14">Uniform with original targets</text><circle cx="667.90" cy="125" r="5.5" fill="#AB6020"/><text x="25" y="161" font-size="14">In-probe mean with original targets</text><circle cx="674.24" cy="157" r="5.5" fill="#5277A5"/><text x="25" y="193" font-size="14">Matched-drift expectation</text><circle cx="396.82" cy="189" r="5.5" fill="#7A8D9C"/><text x="25" y="225" font-size="14">Shuffled targets (central 95%)</text><path d="M573.27 220 H668.58" stroke="#677CAA" stroke-width="5" stroke-linecap="round"/><circle cx="620.40" cy="220" r="5.5" fill="#677CAA"/><text x="25" y="311" font-size="15" font-weight="600">Paired actual minus uniform (percentage points)</text><path d="M389.8 320v53" stroke="#D3DFE8"/><text x="389.8" y="392" text-anchor="middle" font-size="12">+0.0000</text><path d="M572.6 320v53" stroke="#D3DFE8"/><text x="572.6" y="392" text-anchor="middle" font-size="12">+0.0010</text><path d="M755.3 320v53" stroke="#D3DFE8"/><text x="755.3" y="392" text-anchor="middle" font-size="12">+0.0020</text><text x="25" y="345" font-size="14">Conditional 95% story interval</text><path d="M365.25 340 H807.68" stroke="#217D77" stroke-width="5" stroke-linecap="round"/><circle cx="580.66" cy="340" r="6" fill="#217D77"/><text x="25" y="421" font-size="13">Paired interval includes zero. Do not prioritize GPU M2 on this evidence.</text></g></svg>
