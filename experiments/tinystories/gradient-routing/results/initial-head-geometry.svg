<text x="24" y="37" font-weight="bold" font-size="23">One checkpoint, two different geometric quantities</text><text x="24" y="64" font-size="14">Archived 4k tied TinyStories model at step 0; 128 training contexts. Pooled across all valid sampled targets.</text>
