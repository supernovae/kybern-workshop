<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 416" role="img" aria-labelledby="title desc">
<title id="title">Synthetic alias test: equal discarded energy, different signal</title>
<desc id="desc">Both arms have the same total null energy. Predictable alias energy includes conditional signal. Stochastic alias energy is all sampling variance. Paired dots are measured with one Monte Carlo standard error.</desc>
