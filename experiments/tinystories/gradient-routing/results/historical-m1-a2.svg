<svg xmlns="http://www.w3.org/2000/svg" width="960" height="451" viewBox="0 0 960 451" role="img" aria-labelledby="title desc"><title id="title">A2: Historical capture with contextual and frequency controls</title><desc id="desc">Actual capture and uniform predictions are nearly identical. Actual is inside the central 95 percent target-permutation range.</desc><rect width="960" height="451" fill="#fff"/><g font-family="system-ui,sans-serif" fill="#20334A"><text x="25" y="37" font-size="23" font-weight="600">A2: Target rows account for almost all the measured excess</text><text x="25" y="63" font-size="14">Fraction of step-0 residual squared energy captured at step 256, centered head.</text><path d="M310.0 78v125" stroke="#D3DFE8"/><text x="310.0" y="222" text-anchor="middle" font-size="12">0.0%</text><path d="M446.2 78v125" stroke="#D3DFE8"/><text x="446.2" y="222" text-anchor="middle" font-size="12">0.1%</text><path d="M582.5 78v125" stroke="#D3DFE8"/><text x="582.5" y="222" text-anchor="middle" font-size="12">0.2%</text><path d="M718.8 78v125" stroke="#D3DFE8"/><text x="718.8" y="222" text-anchor="middle" font-size="12">0.3%</text><path d="M855.0 78v125" stroke="#D3DFE8"/><text x="855.0" y="222" text-anchor="middle" font-size="12">0.4%</text><text x="25" y="101" font-size="14">Actual predictions and targets</text><rect x="310" y="84" width="514.04" height="24" rx="3" fill="#217D77"/><text x="831.04" y="101" font-size="13">0.377278%</text><text x="25" y="141" font-size="14">Uniform p0, same targets</text><rect x="310" y="124" width="513.84" height="24" rx="3" fill="#AD681F"/><text x="830.84" y="141" font-size="13">0.377129%</text><text x="25" y="181" font-size="14">A1 matched-drift expectation</text><rect x="310" y="164" width="116.38" height="24" rx="3" fill="#6578AA"/><text x="433.38" y="181" font-size="13">0.085419%</text><text x="25" y="260" font-size="15" font-weight="600">Close-up: static baseline and shuffled target reference</text><path d="M334.2 271v108" stroke="#D3DFE8"/><text x="334.2" y="399" text-anchor="middle" font-size="12">0.37710%</text><path d="M455.3 271v108" stroke="#D3DFE8"/><text x="455.3" y="399" text-anchor="middle" font-size="12">0.37715%</text><path d="M576.4 271v108" stroke="#D3DFE8"/><text x="576.4" y="399" text-anchor="middle" font-size="12">0.37720%</text><path d="M697.6 271v108" stroke="#D3DFE8"/><text x="697.6" y="399" text-anchor="middle" font-size="12">0.37725%</text><path d="M818.7 271v108" stroke="#D3DFE8"/><text x="818.7" y="399" text-anchor="middle" font-size="12">0.37730%</text><text x="25" y="293" font-size="14">Actual capture</text><circle cx="766.02" cy="288" r="6" fill="#217D77"/><text x="25" y="327" font-size="14">Uniform predictor</text><circle cx="404.56" cy="322" r="6" fill="#AD681F"/><text x="25" y="361" font-size="14">Shuffled targets (central 95%)</text><path d="M594.21 356 H801.83" stroke="#6578AA" stroke-width="5" stroke-linecap="round"/><circle cx="693.32" cy="356" r="6" fill="#6578AA"/><text x="25" y="431" font-size="13">Uniform predictions recover 99.95% of the excess over the null. One checkpoint pair; no learning effect tested.</text></g></svg>
