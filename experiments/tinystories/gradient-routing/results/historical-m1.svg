<svg xmlns="http://www.w3.org/2000/svg" width="920" height="322" viewBox="0 0 920 322" role="img" aria-labelledby="title desc"><title id="title">Historical M1 temporal capture</title><desc id="desc">Centered capture 0.37728 percent versus 0.08542 percent expected under the matched-drift null. Raw capture 0.27222 percent without a raw null.</desc><rect width="920" height="322" fill="#fff"/><g font-family="system-ui,sans-serif" fill="#20334A"><text x="25" y="37" font-size="24" font-weight="600">Historical M1: step 0 residual captured at step 256</text><text x="25" y="65" font-size="15">One tied 4k-vocabulary run; 128 distinct source-train contexts.</text><path d="M320.0 89v138" stroke="#D3DFE8"/><text x="320.0" y="252" text-anchor="middle" font-size="13">0.0%</text><path d="M450.0 89v138" stroke="#D3DFE8"/><text x="450.0" y="252" text-anchor="middle" font-size="13">0.1%</text><path d="M580.0 89v138" stroke="#D3DFE8"/><text x="580.0" y="252" text-anchor="middle" font-size="13">0.2%</text><path d="M710.0 89v138" stroke="#D3DFE8"/><text x="710.0" y="252" text-anchor="middle" font-size="13">0.3%</text><path d="M840.0 89v138" stroke="#D3DFE8"/><text x="840.0" y="252" text-anchor="middle" font-size="13">0.4%</text><text x="25" y="114" font-size="16">Centered capture</text><rect x="320" y="94" width="490.46" height="28" rx="4" fill="#207E79"/><text x="817.46" y="113" font-size="14">0.37728%</text><text x="25" y="161" font-size="16">Centered drift-null expectation</text><rect x="320" y="141" width="111.04" height="28" rx="4" fill="#6479A9"/><text x="438.04" y="160" font-size="14">0.08542%</text><text x="25" y="208" font-size="16">Raw capture (no raw null)</text><rect x="320" y="188" width="353.89" height="28" rx="4" fill="#8A9AA6"/><text x="680.89" y="207" font-size="14">0.27222%</text><text x="580" y="276" text-anchor="middle" font-size="14">Fraction of fixed step 0 residual squared energy</text><text x="25" y="302" font-size="13">Centered excess: +0.29186 pp. Null is an expectation, not uncertainty.</text></g></svg>
