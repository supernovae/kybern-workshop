# Stage 2: lengthen the context from 4,096 to 16,384 tokens. Starts from the
# pretrained run and trains 500 million tokens (about 4% of pretraining) on
# 16,384-token rows from the long-context mixture
# (corpus/long-context-mixture.template.yaml), where every document of 4,096
# tokens or more starts its own row and shorter documents pack around them.
#
# Compose it with context-16k.yaml, which sets the 16,384-token context and
# YaRN RoPE scaling. long-context-abf.yaml is the alternative to compare
# against: a larger RoPE base instead of YaRN.
#
# Measured on one B70, dense attention with recomputation (compile is refused
# with it): 16,384-token rows at 2,348 targets/s, 21.2 GiB peak. Two cards are
# not measured at this length.
schema_version: 2
name: devmind-long-context
seed: 42
training:
  seq_len: 16384
  micro_batch_size: 1
  # 8 rows per update (131,072 targets, as in pretraining), 4 on each card.
  gradient_accumulation: 8
  max_steps: 3815
  max_tokens: 500000000
  grad_clip_norm: 1.0
  deterministic: false
  parent_checkpoint: REPLACE_WITH_PRETRAIN_RUN_DIRECTORY
optimizer:
  name: adamw
  peak: 0.0001
  floor: 0.00001
  warmup_steps: 200
  decay_steps: 3815
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-08
  memory_table_lr_multiplier: 5.0
  memory_table_weight_decay: 0.0
evaluation:
  every_steps: null
  every_tokens: 50000000
  max_batches: 4
checkpoint:
  every_steps: null
  every_tokens: 100000000
  every_minutes: 120
  save_on_new_best: false
  keep_periodic: false
logging:
  every_steps: 10
runtime:
  engine: pytorch
  backend: xpu
  device_index: 0
  secondary_device_indices: [1]
  precision: bf16
  output_head_chunk_tokens: 2048
  memory:
    activation_checkpointing:
      enabled: true
      strategy: transformer_block
staging:
  smoke_steps: 2
  warmup_steps: 5
