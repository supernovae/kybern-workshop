# Stage 2: long-context training on 16,384-token rows of long documents,
# starting from the pretrained checkpoint. Pretraining stays at 4,096-token
# rows; this short stage teaches the model the longer context.
#
# Measured on one B70, dense attention with recomputation: 16,384-token rows
# at 2,348 targets/s (21.2 GiB peak). 32,768-token rows need
# optimizer.state_offload: true and run at 1,285 targets/s (22.1 GiB peak).
#
# This stage should also raise the RoPE base (or apply YaRN) for the longer
# context. Lab refuses any change to the attention section in a child stage
# today, so it waits on that; see the README.
schema_version: 2
name: devmind-long-context
seed: 42
training:
  seq_len: 16384
  micro_batch_size: 1
  gradient_accumulation: 8
  max_steps: 3815
  max_tokens: 500000000
  grad_clip_norm: 1.0
  deterministic: false
  parent_checkpoint: REPLACE_WITH_PRETRAIN_RUN_DIRECTORY
optimizer:
  name: adamw
  peak: 0.0001
  floor: 0.00001
  warmup_steps: 200
  decay_steps: 3815
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-08
  memory_table_lr_multiplier: 5.0
  memory_table_weight_decay: 0.0
evaluation:
  every_steps: null
  every_tokens: 50000000
  max_batches: 4
checkpoint:
  every_steps: null
  every_tokens: 100000000
  every_minutes: 120
  save_on_new_best: false
  keep_periodic: false
logging:
  every_steps: 10
runtime:
  engine: pytorch
  backend: xpu
  device_index: 0
  precision: bf16
  output_head_chunk_tokens: 2048
  memory:
    activation_checkpointing:
      enabled: true
      strategy: transformer_block
staging:
  smoke_steps: 2
  warmup_steps: 5
