schema_version: 2
name: devmind-first32-retained-v1
seed: 42
model:
  vocab_size: 32768
  hidden_dim: 1024
  num_layers: 24
  num_heads: 16
  num_kv_heads: 16
  ffn_dim: 2816
  max_seq_len: 2048
  rms_norm_eps: 1.0e-06
  tie_embeddings: true
  ffn: dense
  memory: none
tokenizer:
  path: ./unbound/tokenizer.json
dataset:
  source: local_text
  cache_dir: ./unbound/cache
  train_max_documents: 100
  validation_max_documents: 100
  train_max_tokens: 4194304
  validation_max_tokens: 65537
  train_path: ./unbound/train.jsonl
  validation_path: ./unbound/validation.jsonl
  license: UNBOUND - export base only; native export supplies verified provenance
training:
  seq_len: 2048
  micro_batch_size: 2
  gradient_accumulation: 32
  max_steps: 32
  max_tokens: 4194304
  grad_clip_norm: 1.0
  deterministic: true
optimizer:
  name: adamw
  peak: 0.0006
  floor: 6.0e-05
  warmup_steps: 4
  weight_decay: 0.1
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  state_offload: false
  decay_steps: 32
runtime:
  engine: pytorch
  backend: rocm
  precision: bf16
  memory:
    activation_checkpointing:
      enabled: true
      strategy: transformer_block
    activation_offload:
      enabled: false
checkpoint:
  every_steps: null
  steps:
  - 4
  - 32
  keep_periodic: false
  retention:
    milestones: []
    terminal_step: 32
    terminal_targets: 4194304
    max_generations: 4
    max_generation_bytes: 6442450944
    max_retained_bytes: 25769803776
    max_peak_bytes: 32212254720
    reserve_free_bytes: 2147483648
evaluation:
  every_steps: 32
  max_batches: 1
logging:
  root_dir: ./unbound/runs
  every_steps: 1
  architecture_diagnostics: scalar
staging:
  smoke_steps: 2
  warmup_steps: 5
