# Stage 1: pretraining. A section: compose it with model.yaml, attention.yaml,
# optimizer.yaml and your local paths (see README) into a complete run config.
schema_version: 2
name: devmind-pretrain
seed: 42
training:
  # One 4,096-token row per microbatch, 32 per update (131,072 targets), 16
  # on each card. Measured on one B70 with compiled blocks and no
  # recomputation: 8,076 targets/s at a 23.1 GiB peak. 8,192-token rows fit too (28.6 GiB, 89% of
  # the card) but run at 5,493 targets/s.
  seq_len: 4096
  micro_batch_size: 1
  gradient_accumulation: 32
  max_steps: 91553
  max_tokens: 12000000000
  grad_clip_norm: 1.0
  deterministic: false
evaluation:
  every_steps: null
  every_tokens: 100000000
  max_batches: 16
checkpoint:
  every_steps: null
  every_tokens: 250000000
  every_minutes: 120
  save_on_new_best: false
  keep_periodic: false
logging:
  every_steps: 20
runtime:
  engine: pytorch
  backend: xpu
  device_index: 0
  # Two B70s. Lab runs the second card in its own process and confines each
  # process to its card, so device memory is not also held in host RAM.
  # Microbatches are split between the cards; gradients are summed on card 0
  # in a fixed order, so an update is the same as on one card. Measured:
  # 12,682 targets/s on both cards against 6,773 on card 0 alone, which also
  # drives the desktop. With four cards, list [1, 2, 3].
  secondary_device_indices: [1]
  precision: bf16
  compile_transformer_blocks: true
  compile_output_head_loss: true
  memory:
    # Lab's planner estimates 31.9 GiB for this config, above its ceiling;
    # the measured peak is 23.1 GiB. Observe the estimate instead of refusing;
    # the spill guard (on by default) stops the run if the card really fills.
    estimate_policy: observe
staging:
  smoke_steps: 2
  warmup_steps: 5
