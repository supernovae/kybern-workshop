# Stage 1: pretraining. A section: compose it with model.yaml, attention.yaml,
# optimizer.yaml and your local paths (see README) into a complete run config.
schema_version: 2
name: devmind-pretrain
seed: 42
training:
  # One 4,096-token row per microbatch, 32 per update (131,072 targets).
  # Measured on one B70 with compiled blocks and no recomputation: 8,076
  # targets/s at a 23.1 GiB peak. 8,192-token rows fit too (28.6 GiB, 89% of
  # the card) but run at 5,493 targets/s.
  seq_len: 4096
  micro_batch_size: 1
  gradient_accumulation: 32
  max_steps: 91553
  max_tokens: 12000000000
  grad_clip_norm: 1.0
  deterministic: false
evaluation:
  every_steps: null
  every_tokens: 100000000
  max_batches: 16
checkpoint:
  every_steps: null
  every_tokens: 250000000
  every_minutes: 120
  save_on_new_best: false
  keep_periodic: false
logging:
  every_steps: 20
runtime:
  engine: pytorch
  backend: xpu
  device_index: 0
  # One device, and run with ZE_AFFINITY_MASK set so the process sees only
  # that card. A process that can see several Arc cards also holds its device
  # memory in host RAM: 37 GiB of host RAM for a 23 GiB device peak, against
  # 8 GiB with one card visible. Lab's secondary devices share one process,
  # so they are left out until that is fixed (see the README).
  precision: bf16
  compile_transformer_blocks: true
  compile_output_head_loss: true
  memory:
    # Lab's planner estimates 31.9 GiB for this config, above its ceiling;
    # the measured peak is 23.1 GiB. Observe the estimate instead of refusing;
    # the spill guard (on by default) stops the run if the card really fills.
    estimate_policy: observe
staging:
  smoke_steps: 2
  warmup_steps: 5
