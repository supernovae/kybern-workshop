publication_mode: metadata_reconstruction_only
policy:
  duplicates:
    heldout_overlap: drop_train_copy
    keys: [raw, normalized]
    resolution: chain_smallest_id
    rights_conflict: allow
  documents:
    empty_text: skip
    exclusions: none
    markdown_kind: first_declared
    row_files: buffered
  rights:
    training_use: allowed_unless_explicitly_prohibited
  build:
    strategy: disk
  mixture:
    total_tokens: 12000000000
    max_exposures: 2
mixture:
  web: 0.3453
  wiki: 0.06
  python: 0.18
  web_code: 0.12
  systems_code: 0.06
  collaboration: 0.12
  notebooks: 0.03
  math: 0.08
  reference: 0.0045
  practice: 0.0002
lm:
  selected: true
  training_splits:
  - train
  - validation
chat:
  selected: false
  training_splits: []
keep_nonredistributable_local: true
normalizer:
  structure_cleaning: true
  front_matter_extra_keys: {}
  gutenberg_boilerplate: []
