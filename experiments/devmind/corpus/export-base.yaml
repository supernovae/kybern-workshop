# Base config for `klab corpus export` only. The export replaces the dataset and
# tokenizer sections with ones bound to the release; the paths here are never
# read, and this file is not a training config.
schema_version: 2
name: devmind-export-base
seed: 42
model:
  vocab_size: 32768
  hidden_dim: 1536
  num_layers: 28
  num_heads: 24
  ffn_dim: 4096
  max_seq_len: 32768
tokenizer:
  path: ./unbound/tokenizer.json
dataset:
  source: local_text
  license: Unbound; the export supplies the release's provenance
  train_path: ./unbound/train.jsonl
  validation_path: ./unbound/validation.jsonl
  cache_dir: ./unbound/cache
  train_max_documents: 100
  validation_max_documents: 100
  train_max_tokens: 1048576
  validation_max_tokens: 65536
attention:
  kind: dense
  implementation: sdpa
training:
  seq_len: 4096
  micro_batch_size: 1
  gradient_accumulation: 32
  max_steps: 8
  max_tokens: 1048576
optimizer:
  name: adamw
  peak: 0.0003
  floor: 0.00003
  warmup_steps: 2
logging:
  root_dir: ./unbound/runs
