# Sparse attention with latent keys and values (MLA). Each token reads its own
# block, the 512 tokens before it and 16 earlier 64-token blocks chosen per head,
# plus one learned summary of every earlier block. Cost per token does not grow
# with context, and a generation cache holds 384-wide latents instead of
# 1,536-wide keys and values.
kind: local_selected
block_size: 64
window_size: 512
selected_blocks: 16
latent_dim: 384
selector: learned
